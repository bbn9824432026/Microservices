# Infrastructure for ShopSphere. Run: docker compose up -d
services:
  mysql:
    image: mysql:8.4
    container_name: shopsphere-mysql
    environment:
      MYSQL_ROOT_PASSWORD: root
    ports:
      # Host port 3307 -> container 3306 (3307 avoids clashing with a local MySQL on 3306)
      - "3307:3306"
    volumes:
      # Scripts in this folder run once, when the data volume is first created
      - ./infra/mysql/init.sql:/docker-entrypoint-initdb.d/init.sql
      - mysql-data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-proot"]
      interval: 5s
      timeout: 5s
      retries: 20

volumes:
  mysql-data:
